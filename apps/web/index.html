<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#191d20" />
    %PAGE_METADATA%
    <script>
      (() => {
        let theme = "dark";
        try {
          const saved = localStorage.getItem("pdfburrow-theme");
          if (saved === "light" || saved === "dark") {
            theme = saved;
          } else if (saved !== null) {
            console.warn("PDFBurrow found an invalid saved theme preference.");
          }
        } catch (error) {
          console.warn("PDFBurrow could not read the initial theme preference.", error);
        }
        document.documentElement.classList.toggle("dark", theme === "dark");
        document.documentElement.style.colorScheme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", theme === "dark" ? "#191d20" : "#ffffff");
      })();
    </script>
    <link rel="stylesheet" href="%BASE_PATH%assets/styles.css" />
  </head>
  <body>
    <noscript>
      <p class="mx-auto max-w-6xl px-6 pt-6">
        Enable JavaScript to use these local PDF tools. You can read about each tool and our privacy
        practices without JavaScript. Documents are never uploaded.
      </p>
    </noscript>
    <div id="root">%PAGE_CONTENT%</div>
    <script type="module" src="%BASE_PATH%assets/main.js"></script>
  </body>
</html>
